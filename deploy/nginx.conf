# 七牛云云服务器 / 任意 VPS 用的反向代理配置
# 把后端容器（运行在 127.0.0.1:8000）通过你的域名暴露出去，并支持大文件上传。
#
# 用法：
#   1. 把下面 server_name 改成你的域名
#   2. 放到 /etc/nginx/conf.d/oc-theme-store.conf
#   3. nginx -t && systemctl reload nginx
#   4. 用 certbot 申请 HTTPS：certbot --nginx -d 你的域名
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;   # ← 改成你的域名

    # 主题包可能较大，放宽上传体积上限（需 >= STORE_MAX_MB）
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
